version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: codespaces-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: tapirhorse
      POSTGRES_DB: rentals
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
